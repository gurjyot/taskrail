name: Tag TaskRail 3.0.1 Once

on:
  push:
    branches: [release-tag-3.0.1]
    paths: [.github/workflows/tag-3.0.1-once.yml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish tag
        env:
          TARGET_SHA: 6d10ebe82f724e2c6812386d18c7fc7349fac1f6
        run: |
          git fetch origin main --tags
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "3.0.1"
          if git rev-parse -q --verify refs/tags/v3.0.1 >/dev/null; then
            test "$(git rev-list -n 1 v3.0.1)" = "$TARGET_SHA"
            exit 0
          fi
          git tag v3.0.1 "$TARGET_SHA"
          git push origin refs/tags/v3.0.1
