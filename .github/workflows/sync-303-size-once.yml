name: Sync 3.0.3 footprint once

on:
  push:
    branches:
      - hotfix/3.0.3-deploy-preflight
    paths:
      - .github/workflows/sync-303-size-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/3.0.3-deploy-preflight
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync canonical README footprint
        run: |
          npm run size:sync
          rm .github/workflows/sync-303-size-once.yml
      - name: Commit canonical footprint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/sync-303-size-once.yml
          git commit -m "Sync TaskRail 3.0.3 measured footprint [skip ci]"
          git push origin HEAD:hotfix/3.0.3-deploy-preflight
