name: Publish Certified TaskRail v3.0.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3-release.yml

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v3.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "v${VERSION}" = "${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "df98a41e3fdbd32e4975700fb27ecfb05822378e"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install development dependencies
        run: npm ci
      - name: Run full release certification
        run: npm run certify
      - name: Build exact install payload
        run: npm run build:install-release
      - name: Add native setup files and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp installers/taskrail-install-linux.sh release-install/TaskRail-Install-Linux.sh
          cp installers/TaskRail-Install.command release-install/TaskRail-Install-macOS.command
          cp installers/TaskRail-Install.ps1 release-install/TaskRail-Install-Windows.ps1
          cd release-install
          sha256sum * > SHA256SUMS
      - name: Attest release checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: release-install/SHA256SUMS
      - name: Attest TaskRail install manifest
        uses: actions/attest@v4
        with:
          subject-path: release-install/taskrail-install-manifest.json
      - name: Create GitHub release from verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release-install/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "TaskRail ${RELEASE_TAG}"
