name: TaskRail Final Test Alignment Once
on:
  push:
    branches: [hardening/final-transaction-correctness]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/final-transaction-correctness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align fault semantics and legacy assertions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); t=p.read_text(); n=t.count(old)
              if n != count: raise SystemExit(f'{path}: expected {count} matches, found {n}: {old[:80]}')
              p.write_text(t.replace(old,new))

          rep('src/deployment.ts',
              """            if (await pathExists(target)) throw new Error('partial first deployment remains live after cleanup');\n            await restoreState(stateFile, priorState);\n            initialCleanupSucceeded = true;""",
              """            if (await pathExists(target)) throw new Error('partial first deployment remains live after cleanup');\n            initialCleanupSucceeded = true;\n            await restoreState(stateFile, priorState);""")

          for f in ['test/contracts.test.ts','test/reliability.test.ts']:
              rep(f,
                  """  assert.equal(result.deployed, false);\n  assert.equal(result.rolledBack, true);\n  assert.equal(await readFile(path.join(deploy, 'index.txt'), 'utf8'), 'old');""",
                  """  assert.equal(result.deployed, false);\n  assert.equal(result.rolledBack, false);\n  assert.equal(result.rollbackAttempted, true);\n  assert.equal(result.rollbackSucceeded, false);\n  assert.equal(result.recoveryRequired, true);\n  assert.equal(await readFile(path.join(deploy, 'index.txt'), 'utf8'), 'old');""")
              rep(f,
                  "/rollback failed|restored version failed health check/",
                  "/rollback failed|restored (?:version|live target) failed health check/")

          rep('test/production-readiness-hardening.test.ts',
              """    assert.equal(result.deployed, false);\n    assert.equal(result.rolledBack, true);\n    assert.match(result.failure || '', /state commit failed/);\n    assert.equal(await readFile(path.join(deploy, 'index.txt'), 'utf8'), 'old');""",
              """    assert.equal(result.deployed, false);\n    assert.equal(result.rolledBack, false);\n    assert.equal(result.rollbackAttempted, true);\n    assert.equal(result.rollbackSucceeded, false);\n    assert.equal(result.recoveryRequired, true);\n    assert.match(result.failure || '', /state commit failed/);\n    assert.equal(await readFile(path.join(deploy, 'index.txt'), 'utf8'), 'old');""")
          PY
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/deployment.ts test/contracts.test.ts test/reliability.test.ts test/production-readiness-hardening.test.ts
          git commit -m "test: align rollback assertions with truthful outcomes"
          git push origin HEAD:hardening/final-transaction-correctness
