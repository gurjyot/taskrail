name: Finalize 3.0.5 once

on:
  push:
    branches:
      - hotfix/3.0.5-preflight-root
    paths:
      - .github/workflows/finalize-305-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/3.0.5-preflight-root
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bump version and review packaged skills
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data['version'] = '3.0.5'
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text())
          data['version'] = '3.0.5'
          data['packages']['']['version'] = '3.0.5'
          lock.write_text(json.dumps(data, indent=2) + '\n')

          Path('src/version.ts').write_text("export const TASKRAIL_VERSION = '3.0.5';\n")

          platform = Path('platform-install/manifest.json')
          data = json.loads(platform.read_text())
          data['taskrailVersion'] = '3.0.5'
          platform.write_text(json.dumps(data, indent=2) + '\n')

          for skill in sorted(Path('skills').glob('*/SKILL.md')):
              text = skill.read_text()
              if 'reviewed_for_taskrail: 3.0.4' not in text:
                  raise SystemExit(f'Unexpected skill review marker in {skill}')
              skill.write_text(text.replace('reviewed_for_taskrail: 3.0.4', 'reviewed_for_taskrail: 3.0.5', 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          section = '''## 3.0.5\n\n- Fixed `safeDeploy` so deployment preflight always runs against the automation project root instead of a rewritten absolute-path manifest from the caller working directory.\n- Added Ads-shaped regression coverage for sibling capabilities, dependency lockfiles, validation/test/health, and nested project-root deployment.\n- Preflight deployment failures now include the exact failing check names/details in the failure report instead of only a generic `preflight failed` message.\n- Reviewed all packaged TaskRail skills for 3.0.5 under the enforced skill-freshness release invariant.\n\n'''
          if '## 3.0.5\n' not in text:
              changelog.write_text(text.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1))
          PY
      - run: npm ci
      - name: Verify skill freshness before footprint sync
        run: npm run skills:check
      - name: Sync canonical README footprint
        run: npm run size:sync
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/finalize-305-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts platform-install/manifest.json skills CHANGELOG.md README.md .github/workflows/finalize-305-once.yml
          git commit -m "Finalize TaskRail 3.0.5 preflight hotfix [skip ci]"
          git push origin HEAD:hotfix/3.0.5-preflight-root
