name: Cleanup dead CLI once

on:
  push:
    branches:
      - hotfix/3.0.3-deploy-preflight
    paths:
      - .github/workflows/cleanup-dead-cli-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/3.0.3-deploy-preflight
      - name: Remove bypassed test and ship implementations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/cli.ts')
          text = path.read_text()
          text = text.replace("import { preflight } from './preflight.js';\n", '')
          text, count_ship_fn = re.subn(
              r"\nasync function commandShip\(manifest: FrameworkManifest, cwd: string\) \{.*?\n\}\n\nasync function main\(\)",
              "\nasync function main()",
              text,
              count=1,
              flags=re.S,
          )
          text, count_test = re.subn(
              r"\n  if \(cmd === 'test'\) \{.*?\n  \}\n\n  if \(cmd === 'deploy'\)",
              "\n  if (cmd === 'deploy')",
              text,
              count=1,
              flags=re.S,
          )
          text, count_ship_route = re.subn(
              r"\n  if \(cmd === 'ship'\) return commandShip\(manifest, cwd\);\n",
              "\n",
              text,
              count=1,
          )
          if (count_ship_fn, count_test, count_ship_route) != (1, 1, 1):
              raise SystemExit(f'unexpected cleanup counts: ship_fn={count_ship_fn} test={count_test} ship_route={count_ship_route}')
          path.write_text(text)
          PY
          rm .github/workflows/cleanup-dead-cli-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts .github/workflows/cleanup-dead-cli-once.yml
          git commit -m "Remove dead duplicate CLI implementations [skip ci]"
          git push origin HEAD:hotfix/3.0.3-deploy-preflight
