name: Verify Ecosystem Dispatch Secret Once

on:
  push:
    branches: [proper-release-and-ecosystem-update]
    paths: [.github/workflows/check-ecosystem-dispatch-secret-once.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proper-release-and-ecosystem-update
      - name: Require dispatch secret
        env:
          TOKEN: ${{ secrets.TASKRAIL_ECOSYSTEM_DISPATCH_TOKEN }}
        run: test -n "$TOKEN"
      - name: Record configured secret without exposing it
        run: |
          printf 'TASKRAIL_ECOSYSTEM_DISPATCH_TOKEN=configured\n' > .ecosystem-dispatch-secret-ok
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ecosystem-dispatch-secret-ok
          git commit -m "Verify ecosystem dispatch credential is configured"
          git push origin HEAD:proper-release-and-ecosystem-update
