name: Verify TaskRail v3.0.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-v3-release.yml

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for normal release workflow and record result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 40); do
            if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,publishedAt,assets >/tmp/release.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 10
          done
          if [ "$ok" != true ]; then
            printf '%s\n' '{"ok":false,"tag":"v3.0.0","reason":"release-not-published"}' > .taskrail-v3-release-status.json
          else
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/release.json','utf8')); fs.writeFileSync('.taskrail-v3-release-status.json', JSON.stringify({ok:true,tag:r.tagName,name:r.name,publishedAt:r.publishedAt,assets:(r.assets||[]).map(a=>a.name)},null,2)+'\\n')"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .taskrail-v3-release-status.json
          git commit -m "Record TaskRail 3 release verification"
          git push origin HEAD:main
