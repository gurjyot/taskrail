name: Hardening Size Sync

on:
  push:
    branches: [hardening-bounded-deterministic]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-bounded-deterministic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run size:sync
      - name: Commit measured footprint
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Sync measured package footprint"
          git push origin HEAD:hardening-bounded-deterministic
