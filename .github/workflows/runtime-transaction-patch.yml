name: Runtime Transaction Patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.actor == github.repository_owner && github.event.issue.title == 'Apply transactional runtime patch v3.0.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch, build and focused test
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/deployment.ts')
          s = p.read_text()
          if "from './systemd.js'" not in s:
              needle = "import { runBoundedCommand } from './bounded-command.js';\n"
              assert needle in s
              s = s.replace(needle, needle + "import { verifySystemdRuntimeContext } from './systemd.js';\n", 1)

          if 'function productionRuntimeChecks' not in s:
              marker = "function fingerprintInputs(manifest: FrameworkManifest, git: GitState) {\n"
              assert marker in s
              helper = """function productionRuntimeChecks(manifest: FrameworkManifest, environment: EnvironmentInfo) {
            if (environment.name !== 'production' || process.platform !== 'linux' || manifest.serviceManager?.type !== 'systemd') return [];
            return verifySystemdRuntimeContext(manifest, { environment: environment.name });
          }

          """
              s = s.replace(marker, helper + marker, 1)

          noop_health = "const health = await runHealthCheck(manifest.healthCheck ?? manifest.healthChecks?.[0], strategy === 'release-symlink' ? existingReleasePath : target, plugin, manifest.healthCommand || manifest.runtimeHealthCommand);"
          pos = s.index(noop_health)
          cond = "if (health.ok) {"
          cpos = s.index(cond, pos)
          before = s[pos:cpos]
          if 'productionRuntimeChecks(manifest, envInfo)' not in before:
              indent = s[s.rfind('\n', cpos)+1:cpos]
              s = s[:cpos] + f"const runtimeChecks = health.ok ? productionRuntimeChecks(manifest, envInfo) : [];\n{indent}if (health.ok && runtimeChecks.every((check) => check.passed)) {{" + s[cpos+len(cond):]

          live_health = "const health = await runHealthCheck(manifest.healthCheck ?? manifest.healthChecks?.[0], liveCheckPath, plugin, manifest.healthCommand || manifest.runtimeHealthCommand);"
          pos = s.index(live_health)
          cpos = s.index(cond, pos)
          before = s[pos:cpos]
          if 'runtimeFailures' not in before:
              indent = s[s.rfind('\n', cpos)+1:cpos]
              replacement = f"const runtimeChecks = health.ok ? productionRuntimeChecks(manifest, envInfo) : [];\n{indent}const runtimeFailures = runtimeChecks.filter((check) => !check.passed);\n{indent}if (health.ok && runtimeFailures.length === 0) {{"
              s = s[:cpos] + replacement + s[cpos+len(cond):]

          restored_line = "const restored = await runHealthCheck(manifest.healthCheck ?? manifest.healthChecks?.[0], restoredPath, plugin, manifest.healthCommand || manifest.runtimeHealthCommand);"
          pos = s.index(restored_line)
          fail_cond = "if (!restored.ok) {"
          cpos = s.index(fail_cond, pos)
          before = s[pos:cpos]
          if 'restoredRuntimeReady' not in before:
              indent = s[s.rfind('\n', cpos)+1:cpos]
              replacement = f"const restoredRuntimeChecks = restored.ok ? productionRuntimeChecks(manifest, envInfo) : [];\n{indent}const restoredRuntimeReady = restoredRuntimeChecks.every((check) => check.passed);\n{indent}if (!restored.ok || !restoredRuntimeReady) {{"
              s = s[:cpos] + replacement + s[cpos+len(fail_cond):]

          s = s.replace("failure: 'health check failed and rollback failed'", "failure: runtimeFailures.length ? 'runtime context failed and rollback verification failed' : 'health check failed and rollback failed'", 1)
          s = s.replace("failure: 'health check failed; rollback succeeded'", "failure: runtimeFailures.length ? 'runtime context failed; rollback succeeded' : 'health check failed; rollback succeeded'", 1)
          p.write_text(s)

          p = Path('src/ship-command.ts')
          s = p.read_text()
          s = s.replace("import { loadManifest, resolvePaths } from './config.js';", "import { loadManifest } from './config.js';")
          s = s.replace("import { loadPlugins, rollbackFromState, safeDeploy } from './deployment.js';", "import { loadPlugins, safeDeploy } from './deployment.js';")
          marker = "  const runtimeFailures = runtimeChecks.filter((check) => !check.passed);\n"
          start = s.index(marker) + len(marker)
          shipped = "  const shipped = result.deployed && runtimeFailures.length === 0;\n"
          end = s.index(shipped, start)
          s = s[:start] + s[end:]
          s = s.replace(", runtimeRollback, shipped", ", shipped")
          s = s.replace("      ...(runtimeRollback.attempted ? [`RUNTIME_ROLLBACK: ${runtimeRollback.ok ? 'PASS' : 'FAIL'}`] : []),\n", "")
          old_next = "runtimeFailures.length ? (runtimeRollback.ok ? 'fix runtime permissions/systemd context before retrying ship' : 'inspect rollback/runtime state before any retry') : 'taskrail explain deploy'"
          s = s.replace(old_next, "runtimeFailures.length ? 'runtime context was rejected by the deployment transaction; fix permissions/systemd context before retrying ship' : 'taskrail explain deploy'")
          p.write_text(s)
          PY
          npm ci
          npm run build
          node --test dist/test/systemd.test.js dist/test/transactional-deploy.test.js
          } 2>&1 | tee patch.log
      - name: Commit when green
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/deployment.ts src/ship-command.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: make runtime validation transactional'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.patch.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          tail_text="$(tail -n 40 patch.log 2>/dev/null || true)"
          body="Transactional runtime patch outcome: ${OUTCOME}\n\nLast output:\n\`\`\`\n${tail_text}\n\`\`\`"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "${body:0:60000}"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
      - name: Fail when patch failed
        if: steps.patch.outcome != 'success'
        run: exit 1
