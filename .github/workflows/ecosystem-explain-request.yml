name: TaskRail Ecosystem Explain Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  explain:
    if: github.actor == github.repository_owner && github.event.issue.title == 'Explain TaskRail ecosystem failure v3.0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: gurjyot/taskrail-capabilities
          path: .ecosystem/taskrail-capabilities
      - uses: actions/checkout@v4
        with:
          repository: gurjyot/taskrail-automations
          path: .ecosystem/taskrail-automations
      - name: Print underlying check results
        env:
          TASKRAIL_CAPABILITY_ROOTS: ${{ github.workspace }}/.ecosystem/taskrail-capabilities/capabilities
        shell: bash
        run: |
          node --input-type=module <<'NODE' > explain.txt
          import fs from 'node:fs';
          import path from 'node:path';
          import { check } from './dist/src/deployment.js';
          import { resolveFrameworkManifest } from './dist/src/framework.js';
          const targets = [
            'commerce/abandoned-checkout-escalation',
            'crm/lead-response-time-monitor',
            'monitoring/website-form-failure-detector',
            'wordpress/plugin-vulnerability-watch',
          ];
          for (const target of targets) {
            const manifestPath = path.resolve('.ecosystem/taskrail-automations', target, 'automation.json');
            const manifest = resolveFrameworkManifest(JSON.parse(fs.readFileSync(manifestPath, 'utf8')));
            const result = await check(manifest, { cwd: path.dirname(manifestPath) });
            console.log(`===== ${target} =====`);
            console.log(JSON.stringify(result, null, 2));
          }
          NODE
      - name: Report explanation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(tail -c 55000 explain.txt)"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "\`\`\`json\n${body}\n\`\`\`"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
