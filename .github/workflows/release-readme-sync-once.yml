name: Release README Sync Once

on:
  push:
    branches: [release/3.0.1-cleanup]
    paths: [.github/workflows/release-readme-sync-once.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.0.1-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size:sync
      - name: Commit synced README
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync 3.0.1 package footprint"
          git push origin HEAD:release/3.0.1-cleanup
