name: TaskRail MCP Adapter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskrail-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdio-adapter:
    name: MCP stdio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build TaskRail core
        run: npm ci && npm run build
      - name: Pack core and MCP separately, install both into a clean project, and test stdio
        run: node scripts/test-mcp-packed.mjs
