name: Publish TaskRail v3.0.0 Tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3-tag.yml

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish v3.0.0
        env:
          RELEASE_SHA: df98a41e3fdbd32e4975700fb27ecfb05822378e
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_SHA"
          version="$(git show "$RELEASE_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$version" = "3.0.0"
          if git ls-remote --exit-code --tags origin refs/tags/v3.0.0 >/dev/null 2>&1; then
            echo "v3.0.0 already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v3.0.0 "$RELEASE_SHA" -m "TaskRail 3.0.0"
          git push origin refs/tags/v3.0.0
