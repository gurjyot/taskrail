name: Verify Ecosystem Dispatch Secret Once

on:
  push:
    branches: [activate-ecosystem-dispatch]
    paths: [.github/workflows/verify-ecosystem-dispatch-secret-once.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate-ecosystem-dispatch
      - name: Verify secret and private dispatch access
        env:
          GH_TOKEN: ${{ secrets.TASKRAIL_ECOSYSTEM_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api --method POST \
            repos/gurjyot/taskrail-ecosystem/dispatches \
            -f event_type=taskrail-core-changed \
            -f "client_payload[sha]=88cdd8ecb6f7421500979f6867a076da8a2f1fb4" \
            -f "client_payload[repository]=gurjyot/taskrail" \
            -f "client_payload[run_url]=secret-verification"
      - name: Record verification without exposing secret
        run: |
          printf 'dispatch-secret=verified\n' > .ecosystem-dispatch-secret-ok
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ecosystem-dispatch-secret-ok
          git commit -m "Verify ecosystem dispatch credential"
          git push origin HEAD:activate-ecosystem-dispatch
