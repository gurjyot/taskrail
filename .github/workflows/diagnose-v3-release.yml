name: Diagnose TaskRail v3.0.0 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-v3-release.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Record release and workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release='null'
          if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,publishedAt,assets >/tmp/release.json 2>/dev/null; then
            release="$(cat /tmp/release.json)"
          fi
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'TaskRail Release' --limit 5 --json databaseId,status,conclusion,headSha,event,displayTitle,createdAt,updatedAt 2>/dev/null || printf '[]')"
          body="$(node -e "const release=JSON.parse(process.argv[1]); const runs=JSON.parse(process.argv[2]); console.log('Release:'); console.log('\\`\\`\\`json'); console.log(JSON.stringify(release,null,2)); console.log('\\`\\`\\`'); console.log('Release workflow runs:'); console.log('\\`\\`\\`json'); console.log(JSON.stringify(runs,null,2)); console.log('\\`\\`\\`')" "$release" "$runs")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'TaskRail v3.0.0 release diagnostic in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'TaskRail v3.0.0 release diagnostic' --body "$body"
          fi
