name: TaskRail Final Correctness Patch Once

on:
  push:
    branches: [hardening/final-transaction-correctness]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/final-transaction-correctness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow correctness patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new))

          # deployment outcome truthfulness + cwd + fail-closed health
          replace_once('src/deployment.ts',
          """export interface DeployOutcome extends DeployResult {\n  backupPath?: string;\n  failure?: string;\n  releaseId?: string;\n  releasePath?: string;\n  report?: string;\n  sha?: string;\n}\n""",
          """export interface DeployOutcome extends DeployResult {\n  backupPath?: string;\n  failure?: string;\n  releaseId?: string;\n  releasePath?: string;\n  report?: string;\n  sha?: string;\n  rollbackAttempted?: boolean;\n  rollbackSucceeded?: boolean;\n  recoveryRequired?: boolean;\n}\n""")

          replace_once('src/deployment.ts',
          "environment: EnvironmentInfo = detectEnvironment(manifest, process.cwd()),",
          "environment: EnvironmentInfo = detectEnvironment(manifest, cwd),")

          replace_once('src/deployment.ts',
          "        return { ok: true, tier: 'process' as const };",
          "        return { ok: false, tier: 'process' as const, details: `unsupported health check type: ${String((definition as any)?.type ?? 'missing')}` };" )

          replace_once('src/deployment.ts',
          "      if (await pathExists(target)) previousReleasePath = await currentLivePath(target);",
          "      if (await pathExists(target)) previousReleasePath = state?.releasePath || await currentLivePath(target);")

          old_catch = """    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      let rollbackError: string | undefined;\n      let restored = false;\n      if (mutationStarted) {\n        try {\n          if (strategy === 'release-symlink') await restoreActivation(target, backup, previousReleasePath);\n          else {\n            await rm(target, { recursive: true, force: true });\n            if (await pathExists(backup)) await rename(backup, target);\n          }\n          const restoredPath = strategy === 'release-symlink' ? (previousReleasePath || target) : target;\n          const restoredReadiness = await verifyOperationalReadiness(manifest, restoredPath, operationalPlugin, envInfo);\n          if (!restoredReadiness.ok) throw new Error(restoredReadiness.error || restoredReadiness.health.details || 'restored release is not operationally ready');\n          await restoreState(stateFile, priorState);\n          restored = true;\n        } catch (restoreFailure) {\n          rollbackError = restoreFailure instanceof Error ? restoreFailure.message : String(restoreFailure);\n        }\n      }\n\n      await appendAudit(historyFile, {\n        ts: new Date().toISOString(),\n        type: restored ? 'deploy_rolled_back' : 'deploy_recovery_required',\n        project: manifest.name,\n        taskrailVersion: TASKRAIL_VERSION,\n        releaseId: release.releaseId,\n        sha: git.sha,\n        stage: transactionStage,\n        error: message,\n        rollbackError,\n      }).catch(() => undefined);\n      await writeReceipt(workspace, {\n        automation: manifest.name,\n        environment: envInfo.name,\n        sha: git.sha,\n        taskrailVersion: TASKRAIL_VERSION,\n        releaseId: release.releaseId,\n        migration: 'PASS',\n        transactionStage,\n        rollback: restored ? 'PASS' : 'FAIL',\n        error: message,\n        rollbackError,\n        deployedAt: new Date().toISOString(),\n      }).catch(() => undefined);\n      await writeEvidence(workspace, {\n        kind: 'deploy',\n        project: manifest.name,\n        verdict: 'FAIL',\n        deployAllowed: false,\n        releaseId: release.releaseId,\n        sha: git.sha,\n        environment: envInfo.name,\n      }).catch(() => undefined);\n\n      return {\n        deployed: false,\n        rolledBack: mutationStarted,\n        backupPath: backup,\n        failure: restored\n          ? `${transactionStage} failed; rollback succeeded: ${message}`\n          : `${transactionStage} failed; rollback requires recovery: ${message}${rollbackError ? `; ${rollbackError}` : ''}`,\n        releaseId: release.releaseId,\n        report: failure({\n          project: manifest.name,\n          taskrailVersion: TASKRAIL_VERSION,\n          stage: transactionStage,\n          category: restored ? 'transaction_failed' : 'recovery_required',\n          message: restored ? message : `${message}${rollbackError ? `; rollback: ${rollbackError}` : ''}`,\n          releaseId: release.releaseId,\n          rollbackAttempted: mutationStarted,\n          rollbackResult: restored ? 'success' : mutationStarted ? 'failed' : 'not-needed',\n          nextStep: restored ? 'fix the candidate and redeploy' : 'inspect the live target and last-known-good release; recovery is required',\n          environment: envInfo.name,\n        }),\n      };\n    }\n"""
          new_catch = """    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      const hadPreviousDeployment = Boolean(previousReleasePath || priorState?.releasePath || await pathExists(backup));\n      const rollbackAttempted = mutationStarted && hadPreviousDeployment;\n      let rollbackError: string | undefined;\n      let restored = false;\n      let initialCleanupSucceeded = false;\n      if (mutationStarted) {\n        try {\n          if (strategy === 'release-symlink') await restoreActivation(target, backup, previousReleasePath);\n          else {\n            await rm(target, { recursive: true, force: true });\n            if (await pathExists(backup)) await rename(backup, target);\n          }\n          if (hadPreviousDeployment) {\n            const restoredReadiness = await verifyOperationalReadiness(manifest, target, operationalPlugin, envInfo);\n            if (!restoredReadiness.ok) throw new Error(restoredReadiness.error || restoredReadiness.health.details || 'restored live target is not operationally ready');\n            await restoreState(stateFile, priorState);\n            restored = true;\n          } else {\n            if (await pathExists(target)) throw new Error('partial first deployment remains live after cleanup');\n            await restoreState(stateFile, priorState);\n            initialCleanupSucceeded = true;\n          }\n        } catch (restoreFailure) {\n          rollbackError = restoreFailure instanceof Error ? restoreFailure.message : String(restoreFailure);\n        }\n      }\n      const recoveryRequired = rollbackAttempted && !restored;\n\n      await appendAudit(historyFile, {\n        ts: new Date().toISOString(),\n        type: restored ? 'deploy_rolled_back' : recoveryRequired ? 'deploy_recovery_required' : 'deploy_failed',\n        project: manifest.name,\n        taskrailVersion: TASKRAIL_VERSION,\n        releaseId: release.releaseId,\n        sha: git.sha,\n        stage: transactionStage,\n        error: message,\n        rollbackError,\n      }).catch(() => undefined);\n      await writeReceipt(workspace, {\n        automation: manifest.name,\n        environment: envInfo.name,\n        sha: git.sha,\n        taskrailVersion: TASKRAIL_VERSION,\n        releaseId: release.releaseId,\n        migration: 'PASS',\n        transactionStage,\n        rollback: restored ? 'PASS' : rollbackAttempted ? 'FAIL' : 'NOT_NEEDED',\n        error: message,\n        rollbackError,\n        deployedAt: new Date().toISOString(),\n      }).catch(() => undefined);\n      await writeEvidence(workspace, {\n        kind: 'deploy',\n        project: manifest.name,\n        verdict: 'FAIL',\n        deployAllowed: false,\n        releaseId: release.releaseId,\n        sha: git.sha,\n        environment: envInfo.name,\n      }).catch(() => undefined);\n\n      return {\n        deployed: false,\n        rolledBack: restored,\n        rollbackAttempted,\n        rollbackSucceeded: restored,\n        recoveryRequired,\n        backupPath: backup,\n        failure: restored\n          ? `${transactionStage} failed; rollback succeeded: ${message}`\n          : recoveryRequired\n            ? `${transactionStage} failed; rollback requires recovery: ${message}${rollbackError ? `; ${rollbackError}` : ''}`\n            : initialCleanupSucceeded\n              ? `${transactionStage} failed; partial first deployment cleaned up: ${message}`\n              : `${transactionStage} failed before rollback was required: ${message}${rollbackError ? `; cleanup: ${rollbackError}` : ''}`,\n        releaseId: release.releaseId,\n        report: failure({\n          project: manifest.name,\n          taskrailVersion: TASKRAIL_VERSION,\n          stage: transactionStage,\n          category: restored ? 'transaction_failed' : recoveryRequired ? 'recovery_required' : 'deployment_failed',\n          message: restored ? message : `${message}${rollbackError ? `; rollback: ${rollbackError}` : ''}`,\n          releaseId: release.releaseId,\n          rollbackAttempted,\n          rollbackResult: restored ? 'success' : rollbackAttempted ? 'failed' : 'not-needed',\n          nextStep: restored ? 'fix the candidate and redeploy' : recoveryRequired ? 'inspect the live target and last-known-good release; recovery is required' : 'fix the candidate and retry the deployment',\n          environment: envInfo.name,\n        }),\n      };\n    }\n"""
          replace_once('src/deployment.ts', old_catch, new_catch)

          old_rollback = """export async function rollbackFromState(\n  stateFile: string,\n  health: HealthCheckDefinition | HealthCheckDefinition[] | undefined,\n  plugin?: AutomationPlugin,\n  manifest?: FrameworkManifest,\n  environment?: EnvironmentInfo,\n) {\n  const state = await readState(stateFile);\n  if (!state) return { ok: false, failure: 'missing rollback state' };\n  try {\n    await restoreActivation(state.targetPath, state.backupPath || '', state.previousReleasePath);\n    const restoredPath = state.previousReleasePath || state.targetPath;\n    if (manifest) {\n      const readiness = await verifyOperationalReadiness(manifest, restoredPath, plugin, environment ?? detectEnvironment(manifest, process.cwd()));\n      if (!readiness.ok) return { ok: false, failure: `restored version failed operational readiness${readiness.error ? `: ${readiness.error}` : readiness.health.details ? `: ${readiness.health.details}` : ''}` };\n    } else {\n      const restored = await runHealthCheck(health, restoredPath, plugin);\n      if (!restored.ok) return { ok: false, failure: 'restored version failed health check' };\n    }\n    return { ok: true, failure: undefined };\n  } catch (error) {\n    return { ok: false, failure: `rollback failed${error instanceof Error ? `: ${error.message}` : ''}` };\n  }\n}\n"""
          new_rollback = """export async function rollbackFromState(\n  stateFile: string,\n  health: HealthCheckDefinition | HealthCheckDefinition[] | undefined,\n  plugin?: AutomationPlugin,\n  manifest?: FrameworkManifest,\n  environment?: EnvironmentInfo,\n) {\n  const state = await readState(stateFile);\n  if (!state) return { ok: false, failure: 'missing rollback state' };\n  if (!state.previousReleasePath && !state.backupPath) return { ok: false, failure: 'no previous deployment is available for rollback' };\n  const previousReleasePath = state.previousReleasePath;\n  const priorCurrentReleasePath = state.releasePath;\n  try {\n    if (manifest?.deployStrategy?.type === 'replace-in-place' && previousReleasePath && path.resolve(previousReleasePath) !== path.resolve(state.targetPath)) {\n      await rm(state.targetPath, { recursive: true, force: true });\n      await copyDir(previousReleasePath, state.targetPath);\n    } else {\n      await restoreActivation(state.targetPath, state.backupPath || '', previousReleasePath);\n    }\n    if (manifest) {\n      const readiness = await verifyOperationalReadiness(manifest, state.targetPath, plugin, environment ?? detectEnvironment(manifest, path.dirname(stateFile)));\n      if (!readiness.ok) return { ok: false, failure: `restored live target failed operational readiness${readiness.error ? `: ${readiness.error}` : readiness.health.details ? `: ${readiness.health.details}` : ''}` };\n    } else {\n      const restored = await runHealthCheck(health, state.targetPath, plugin);\n      if (!restored.ok) return { ok: false, failure: 'restored live target failed health check' };\n    }\n\n    let releaseMeta: { releaseId?: string; sourceRevision?: string } | null = null;\n    if (previousReleasePath) {\n      try {\n        releaseMeta = JSON.parse(await readFile(path.join(previousReleasePath, 'release.json'), 'utf8')) as { releaseId?: string; sourceRevision?: string };\n      } catch {\n        releaseMeta = null;\n      }\n    }\n    const canonicalRestoredPath = previousReleasePath && path.resolve(previousReleasePath) !== path.resolve(state.targetPath) ? previousReleasePath : state.targetPath;\n    const nextState: DeployState = {\n      targetPath: state.targetPath,\n      releasePath: canonicalRestoredPath,\n      previousReleasePath: priorCurrentReleasePath && path.resolve(priorCurrentReleasePath) !== path.resolve(canonicalRestoredPath) ? priorCurrentReleasePath : undefined,\n      currentReleaseId: releaseMeta?.releaseId,\n      currentSha: releaseMeta?.sourceRevision,\n      lastKnownGoodReleasePath: canonicalRestoredPath,\n      lastKnownGoodReleaseId: releaseMeta?.releaseId,\n      lastKnownGoodSha: releaseMeta?.sourceRevision,\n    };\n    await writeState(stateFile, nextState);\n    return { ok: true, failure: undefined, state: nextState };\n  } catch (error) {\n    return { ok: false, failure: `rollback failed${error instanceof Error ? `: ${error.message}` : ''}` };\n  }\n}\n"""
          replace_once('src/deployment.ts', old_rollback, new_rollback)

          # transactional wrapper must never confuse rollback attempt with rollback success
          replace_once('src/transactional-deploy.ts',
          "import { check, safeDeploy, type DeployOptions, type DeployOutcome } from './deployment.js';",
          "import { check, safeDeploy, verifyOperationalReadiness, type DeployOptions, type DeployOutcome } from './deployment.js';")
          replace_once('src/transactional-deploy.ts',
          "import { readPrivateState, writePrivateState } from './private-state.js';",
          "import { readPrivateState, writePrivateState } from './private-state.js';\nimport { detectEnvironment } from './env.js';")

          old_branch = """    if (outcome.rolledBack) {\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'rollback-required', outcome.failure || 'activation failed and rollback was attempted');\n      const rollbackReadiness = await validateLastKnownGoodRecovery({\n        state: priorState,\n        health: declaredHealth,\n        configurationHealth: declaredHealth,\n        plugin,\n        manifest,\n        projectRoot,\n        migrationCompatible,\n      });\n      if (!rollbackReadiness.ok) {\n        checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'recovery-required', `rollback verification failed: ${rollbackReadiness.reasons.join('; ')}`);\n        return { ok: false, reason: outcome.failure || 'rollback requires recovery', outcome, checkpoint };\n      }\n      checkpoint = await recordRecoveryReadiness(projectRoot, checkpoint, rollbackReadiness);\n      await restorePriorState(manifest, projectRoot, priorState);\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'restored', 'last-known-good release restored, state restored, and operationally reverified');\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'committed', 'failed update closed after successful restore', {\n        currentRelease: priorState.lastKnownGoodReleaseId,\n        currentReleasePath: priorState.lastKnownGoodReleasePath,\n        lastKnownGoodRelease: priorState.lastKnownGoodReleaseId,\n        lastKnownGoodReleasePath: priorState.lastKnownGoodReleasePath,\n      });\n      return { ok: false, reason: outcome.failure || 'update rolled back safely', outcome, checkpoint };\n    }\n\n    checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'aborted', outcome.failure || 'deployment stopped before activation');\n"""
          new_branch = """    if (outcome.rollbackAttempted && !outcome.rollbackSucceeded) {\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'recovery-required', outcome.failure || 'live rollback failed; manual recovery is required');\n      return { ok: false, reason: outcome.failure || 'live rollback failed; recovery is required', outcome, checkpoint };\n    }\n\n    if (outcome.rollbackSucceeded || outcome.rolledBack) {\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'rollback-required', outcome.failure || 'activation failed and rollback succeeded');\n      const liveTarget = resolvePaths(manifest, projectRoot).deployDir;\n      const liveReadiness = await verifyOperationalReadiness(manifest, liveTarget, plugin, detectEnvironment(manifest, projectRoot));\n      if (!liveReadiness.ok) {\n        checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'recovery-required', `restored live target verification failed${liveReadiness.error ? `: ${liveReadiness.error}` : liveReadiness.health.details ? `: ${liveReadiness.health.details}` : ''}`);\n        return { ok: false, reason: outcome.failure || 'restored live target requires recovery', outcome, checkpoint };\n      }\n      const rollbackReadiness = await validateLastKnownGoodRecovery({\n        state: priorState,\n        health: declaredHealth,\n        configurationHealth: declaredHealth,\n        plugin,\n        manifest,\n        projectRoot,\n        migrationCompatible,\n      });\n      if (!rollbackReadiness.ok) {\n        checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'recovery-required', `rollback verification failed: ${rollbackReadiness.reasons.join('; ')}`);\n        return { ok: false, reason: outcome.failure || 'rollback requires recovery', outcome, checkpoint };\n      }\n      checkpoint = await recordRecoveryReadiness(projectRoot, checkpoint, rollbackReadiness);\n      await restorePriorState(manifest, projectRoot, priorState);\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'restored', 'live target and last-known-good release restored, state restored, and operationally reverified');\n      checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'committed', 'failed update closed after successful restore', {\n        currentRelease: priorState.lastKnownGoodReleaseId,\n        currentReleasePath: priorState.lastKnownGoodReleasePath,\n        lastKnownGoodRelease: priorState.lastKnownGoodReleaseId,\n        lastKnownGoodReleasePath: priorState.lastKnownGoodReleasePath,\n      });\n      return { ok: false, reason: outcome.failure || 'update rolled back safely', outcome, checkpoint };\n    }\n\n    checkpoint = await transitionUpdate(projectRoot, 'automation', manifest.name, 'aborted', outcome.failure || 'deployment stopped before activation');\n"""
          replace_once('src/transactional-deploy.ts', old_branch, new_branch)

          # required gate checks cannot silently disappear
          replace_once('src/gate.ts',
          """  if (manifest.buildCommand) {\n    const result = await runGateCommand(manifest.buildCommand, path.resolve(cwd, manifest.sourceDir));\n    steps.push({ name: 'build', ok: result.ok, required: required.has('build'), message: result.message, command: result.command, cwd: result.cwd, exitCode: result.exitCode, stdout: result.stdout, stderr: result.stderr });\n  }\n\n  const healthDef""",
          """  if (manifest.buildCommand) {\n    const result = await runGateCommand(manifest.buildCommand, path.resolve(cwd, manifest.sourceDir));\n    steps.push({ name: 'build', ok: result.ok, required: required.has('build'), message: result.message, command: result.command, cwd: result.cwd, exitCode: result.exitCode, stdout: result.stdout, stderr: result.stderr });\n  } else if (required.has('build')) {\n    steps.push({ name: 'build', ok: false, required: true, message: 'required build check is not configured' });\n  }\n\n  if (required.has('migrate')) {\n    const migrateCommand = manifest.migrations?.checkCommand;\n    if (!migrateCommand) {\n      steps.push({ name: 'migrate', ok: false, required: true, message: 'required migrate check is not configured' });\n    } else {\n      const result = await runGateCommand(migrateCommand, path.resolve(cwd, manifest.sourceDir));\n      steps.push({ name: 'migrate', ok: result.ok, required: true, message: result.message, command: result.command, cwd: result.cwd, exitCode: result.exitCode, stdout: result.stdout, stderr: result.stderr });\n    }\n  }\n\n  const healthDef""")

          # runtime manifest validation for health definitions + required implementations
          replace_once('src/validation.ts',
          """function hasDuplicates(values: string[]) {\n  return new Set(values).size !== values.length;\n}\n\nexport function validateConfig""",
          """function hasDuplicates(values: string[]) {\n  return new Set(values).size !== values.length;\n}\n\nfunction validateHealthDefinition(definition: unknown, label: string, errors: string[]) {\n  if (!definition || typeof definition !== 'object') {\n    errors.push(`${label} must be an object`);\n    return;\n  }\n  const value = definition as Record<string, unknown>;\n  if (value.type === 'command') {\n    if (typeof value.command !== 'string' || !value.command.trim()) errors.push(`${label}.command must be a non-empty string`);\n    return;\n  }\n  if (value.type === 'file') {\n    if (typeof value.path !== 'string' || !value.path.trim()) errors.push(`${label}.path must be a non-empty string`);\n    return;\n  }\n  if (value.type === 'http') {\n    if (typeof value.url !== 'string' || !value.url.trim()) errors.push(`${label}.url must be a non-empty URL`);\n    else {\n      try {\n        const parsed = new URL(value.url);\n        if (!['http:', 'https:'].includes(parsed.protocol)) errors.push(`${label}.url must use http or https`);\n      } catch {\n        errors.push(`${label}.url must be a valid URL`);\n      }\n    }\n    if (value.expectStatus !== undefined && (!Number.isInteger(value.expectStatus) || Number(value.expectStatus) < 100 || Number(value.expectStatus) > 599)) errors.push(`${label}.expectStatus must be an integer from 100 to 599`);\n    return;\n  }\n  errors.push(`${label}.type must be command, file, or http`);\n}\n\nexport function validateConfig""")

          replace_once('src/validation.ts',
          """  if (config.manifest.healthCheck && config.manifest.healthChecks?.length) errors.push('manifest must use healthCheck or healthChecks, not both');\n  if (config.manifest.requiredChecks && !config.manifest.requiredChecks.every((check) => allowedChecks.has(check))) errors.push('manifest.requiredChecks contains an unsupported value');\n""",
          """  const rawManifest = config.manifest as any;\n  if (rawManifest.healthCheck && Array.isArray(rawManifest.healthChecks) && rawManifest.healthChecks.length) errors.push('manifest must use healthCheck or healthChecks, not both');\n  if (rawManifest.healthChecks !== undefined && !Array.isArray(rawManifest.healthChecks)) errors.push('manifest.healthChecks must be an array');\n  if (rawManifest.healthCheck !== undefined) validateHealthDefinition(rawManifest.healthCheck, 'manifest.healthCheck', errors);\n  if (Array.isArray(rawManifest.healthChecks)) rawManifest.healthChecks.forEach((item: unknown, index: number) => validateHealthDefinition(item, `manifest.healthChecks[${index}]`, errors));\n  if (config.manifest.requiredChecks && !config.manifest.requiredChecks.every((check) => allowedChecks.has(check))) errors.push('manifest.requiredChecks contains an unsupported value');\n  if (config.manifest.requiredChecks?.includes('build') && !config.manifest.buildCommand?.trim()) errors.push('required build check requires manifest.buildCommand');\n  if (config.manifest.requiredChecks?.includes('migrate') && !config.manifest.migrations?.checkCommand?.trim()) errors.push('required migrate check requires manifest.migrations.checkCommand');\n""")
          PY

          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/deployment.ts src/transactional-deploy.ts src/gate.ts src/validation.ts
          git commit -m "fix: make rollback and gate contracts truthful"
          git push origin HEAD:hardening/final-transaction-correctness
