name: TaskRail Ecosystem Certification Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.actor == github.repository_owner && github.event.issue.title == 'Verify TaskRail ecosystem v3.0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: gurjyot/taskrail-capabilities
          path: .ecosystem/taskrail-capabilities
      - uses: actions/checkout@v4
        with:
          repository: gurjyot/taskrail-automations
          path: .ecosystem/taskrail-automations
      - name: Verify public ecosystem
        id: verify
        continue-on-error: true
        env:
          TASKRAIL_CAPABILITIES_REPO: ${{ github.workspace }}/.ecosystem/taskrail-capabilities
          TASKRAIL_AUTOMATIONS_REPO: ${{ github.workspace }}/.ecosystem/taskrail-automations
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-public-ecosystem.mjs | tee ecosystem-report.json
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s ecosystem-report.json ] && jq -e . ecosystem-report.json >/dev/null 2>&1; then
            summary="$(jq -r '[.checks[] | select(.ok==false) | (.name + (if .stderr then " :: stderr=" + (.stderr|gsub("\\n";" ")|.[-600:]) else "" end) + (if .stdout then " :: stdout=" + (.stdout|gsub("\\n";" ")|.[-600:]) else "" end))] | if length==0 then "none" else join("\n") end' ecosystem-report.json)"
            counts="$(jq -r '"Passed: \(.passed) | Failed: \(.failed)"' ecosystem-report.json)"
          else
            summary="ecosystem report missing or invalid"
            counts=""
          fi
          body="Public ecosystem verification outcome: ${OUTCOME}\n${counts}\nFailed checks:\n${summary}"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "${body:0:60000}"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
      - name: Fail when ecosystem verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
