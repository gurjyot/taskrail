name: TaskRail Public Ecosystem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskrail-public-ecosystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: taskrail

      - uses: actions/checkout@v4
        with:
          repository: gurjyot/taskrail-capabilities
          path: taskrail-capabilities

      - uses: actions/checkout@v4
        with:
          repository: gurjyot/taskrail-automations
          path: taskrail-automations

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskrail/package-lock.json

      - name: Install and build candidate TaskRail
        working-directory: taskrail
        run: npm ci && npm run build

      - name: Verify public first-party consumers
        working-directory: taskrail
        env:
          TASKRAIL_CAPABILITIES_REPO: ${{ github.workspace }}/taskrail-capabilities
          TASKRAIL_AUTOMATIONS_REPO: ${{ github.workspace }}/taskrail-automations
        run: node scripts/verify-public-ecosystem.mjs
