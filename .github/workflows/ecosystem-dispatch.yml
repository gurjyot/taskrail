name: Dispatch First-Party Ecosystem Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Require ecosystem dispatch token
        env:
          TOKEN: ${{ secrets.TASKRAIL_ECOSYSTEM_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TASKRAIL_ECOSYSTEM_DISPATCH_TOKEN is not configured"
            exit 1
          fi

      - name: Dispatch candidate to private ecosystem verifier
        env:
          GH_TOKEN: ${{ secrets.TASKRAIL_ECOSYSTEM_DISPATCH_TOKEN }}
        run: |
          gh api --method POST \
            repos/gurjyot/taskrail-ecosystem/dispatches \
            -f event_type=taskrail-core-changed \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[run_url]=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Dispatched TaskRail ${GITHUB_SHA} for first-party ecosystem verification"
