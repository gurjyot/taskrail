name: Verify TaskRail 3.0.1 Release

on:
  push:
    branches: [release-tag-3.0.1]
    paths: [.github/workflows/verify-3.0.1-release.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-tag-3.0.1
      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=false
          for i in $(seq 1 30); do
            if gh release view v3.0.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,isDraft,isPrerelease,publishedAt > release-verification.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 10
          done
          test "$ok" = true
          jq -e '.tagName == "v3.0.1" and .isDraft == false and .isPrerelease == false' release-verification.json
      - name: Record verification on isolated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-verification.json
          git commit -m "Verify published TaskRail 3.0.1 release"
          git push origin HEAD:release-tag-3.0.1
