name: TaskRail Certification Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  certify:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, 'Certify TaskRail v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and run certification
        id: certify
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .taskrail
          {
            VERSION="$(node -p "require('./package.json').version")"
            test "$ISSUE_TITLE" = "Certify TaskRail v${VERSION}"
            npm ci
            npm run certify
          } 2>&1 | tee .taskrail/request.log
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.certify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .taskrail/certification.json ]; then
            certified="$(jq -r '.certified' .taskrail/certification.json)"
            failed="$(jq -r 'if (.failed|length)==0 then "none" else (.failed|join(", ")) end' .taskrail/certification.json)"
            verdict="$(jq -r '.verdict' .taskrail/certification.json)"
            details="$(jq -r '[.gates[] | select(.ok == false) | "### " + .name + "\n```text\n" + (.detail // "no detail") + "\n```"] | join("\n\n")' .taskrail/certification.json)"
          else
            certified=false
            failed=certification-report-missing
            verdict='TASKRAIL CERTIFICATION - NO REPORT'
            if [ -f .taskrail/request.log ]; then
              request_tail="$(tail -c 6000 .taskrail/request.log)"
              details="Request failed before a certification report was produced.\n\n### request\n\`\`\`text\n${request_tail}\n\`\`\`"
            else
              details='Request failed before a certification report or request log was produced.'
            fi
          fi
          body="Certification outcome: ${OUTCOME}\nCertified: ${certified}\nVerdict: ${verdict}\nFailed gates: ${failed}"
          if [ -n "$details" ]; then body="$body\n\n$details"; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "${body:0:60000}"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
      - name: Fail when certification failed
        if: steps.certify.outcome != 'success'
        run: exit 1
