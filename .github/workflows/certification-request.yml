name: TaskRail Certification Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  certify:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, 'Certify TaskRail v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and run certification
        id: certify
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .taskrail
          {
            VERSION="$(node -p "require('./package.json').version")"
            test "$ISSUE_TITLE" = "Certify TaskRail v${VERSION}"
            npm ci
            npm run certify
          } 2>&1 | tee .taskrail/request.log
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.certify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .taskrail/certification.json ]; then
            certified="$(jq -r '.certified' .taskrail/certification.json)"
            failed="$(jq -r 'if (.failed|length)==0 then "none" else (.failed|join(", ")) end' .taskrail/certification.json)"
            verdict="$(jq -r '.verdict' .taskrail/certification.json)"
            details="$(jq -r '[.gates[] | select(.ok == false) | "### " + .name + "\n```text\n" + (.detail // "no detail") + "\n```"] | join("\n\n")' .taskrail/certification.json)"
          else
            certified=false
            failed=certification-report-missing
            verdict='TASKRAIL CERTIFICATION - NO REPORT'
            if [ -f .taskrail/request.log ]; then
              request_tail="$(tail -c 6000 .taskrail/request.log)"
              details="Request failed before a certification report was produced.\n\n### request\n\`\`\`text\n${request_tail}\n\`\`\`"
            else
              details='Request failed before a certification report or request log was produced.'
            fi
          fi
          body="Certification outcome: ${OUTCOME}\nCertified: ${certified}\nVerdict: ${verdict}\nFailed gates: ${failed}"
          if [ -n "$details" ]; then body="$body\n\n$details"; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "${body:0:60000}"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
      - name: Fail when certification failed
        if: steps.certify.outcome != 'success'
        run: exit 1

  audit-cleanup:
    if: github.actor == github.repository_owner && github.event.issue.title == 'Run TaskRail v3.1 audit cleanup final'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited cleanup and certify
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          historical = subprocess.check_output(['git','show','f59f46bd8aa9848f6b5693cc1c57b37ae466a50d:.github/workflows/runtime-transaction-patch.yml'], text=True)
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY\n", historical, re.S)
          if not match:
              raise SystemExit('could not extract staged cleanup script')
          script = match.group(1)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          old = '''start = s.index("  const result = await safeDeploy(manifest, plugin, {")
after_call = s.index("  const shipped =", start) if "  const shipped =" in s[start:] else -1
if after_call == -1:
    # Replace the post-safeDeploy runtime wrapper as one block.
    marker = "  const shouldVerifyRuntime = result.deployed\\n"
    mstart = s.index(marker, start)
    mend = s.index("\\n\\n  const shipped = result.deployed && runtimeFailures.length === 0;", mstart)
    s = s[:mstart] + "  const shipped = result.deployed;" + s[mend + len("\\n\\n  const shipped = result.deployed && runtimeFailures.length === 0;"):]
else:
    pass
'''
          new = '''start = s.index("  const result = await safeDeploy(manifest, plugin, {")
marker = "  const shouldVerifyRuntime = result.deployed\\n"
mstart = s.index(marker, start)
mend = s.index("\\n\\n  const shipped = result.deployed && runtimeFailures.length === 0;", mstart)
s = s[:mstart] + "  const shipped = result.deployed;" + s[mend + len("\\n\\n  const shipped = result.deployed && runtimeFailures.length === 0;"):]
'''
          if old not in script:
              raise SystemExit('ship wrapper transform changed unexpectedly')
          script = script.replace(old, new, 1)
          script = script.replace("Path('.github/workflows/runtime-transaction-patch.yml').unlink()", "Path('.github/workflows/runtime-transaction-patch.yml').unlink(missing_ok=True)")
          exec(compile(script, 'taskrail-v31-audit-cleanup', 'exec'), {'__name__': '__main__'})

          original = subprocess.check_output(['git','show','78179323790a7700a9f2a895c76dfb8c5a22024e:.github/workflows/certification-request.yml'], text=True)
          Path('.github/workflows/certification-request.yml').write_text(original)
          PY
          npm ci
          npm run certify
      - name: Commit certified source
        if: steps.cleanup.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close TaskRail 3.1 correctness gaps'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report cleanup result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .taskrail/certification.json ]; then
            certified="$(jq -r '.certified' .taskrail/certification.json)"
            verdict="$(jq -r '.verdict' .taskrail/certification.json)"
            failed="$(jq -r 'if (.failed|length)==0 then "none" else (.failed|join(", ")) end' .taskrail/certification.json)"
          else
            certified=false
            verdict='TASKRAIL AUDIT CLEANUP - FAIL'
            failed='patch-or-certification-failed'
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Audit cleanup outcome: ${OUTCOME}\nCertified: ${certified}\nVerdict: ${verdict}\nFailed gates: ${failed}"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
      - name: Fail when cleanup failed
        if: steps.cleanup.outcome != 'success'
        run: exit 1
