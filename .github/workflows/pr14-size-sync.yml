name: PR14 Footprint Sync

on:
  push:
    branches:
      - fix-relative-preflight-and-ship-errors
    paths:
      - .github/workflows/pr14-size-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-relative-preflight-and-ship-errors
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run size:sync
      - name: Commit canonical footprint and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr14-size-sync.yml
          git add README.md
          git commit -m "Sync package footprint"
          git push origin HEAD:fix-relative-preflight-and-ship-errors
