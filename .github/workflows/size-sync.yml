name: TaskRail README Size Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskrail-size-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify exact packed artifact matches README footprint
        run: npm run size:check
      - name: Explain remediation on drift
        if: failure()
        run: echo "Run 'npm run size:sync', commit README.md, and rerun the release gates."
